<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Reset Access Password</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 340px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .links { margin-top: 15px; text-align: center; font-size: 13px; }
        .flash { color: red; font-size: 13px; margin-bottom: 10px; text-align: center; }
        .flash.success { color: #27ae60; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h3>Reset Security Password</h3>
        <p style="font-size: 12px; color: #666;">Security Verification Question:<br><strong>"What is your favorite gene?"</strong></p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="email" name="email" placeholder="Confirm Account Email" required>
            <input type="text" name="security_answer" placeholder="Security Answer" required>
            <input type="password" name="new_password" placeholder="Enter New Password" required>
            <button type="submit">Update Password</button>
        </form>
        <div class="links"><a href="/login">Back to Sign In</a></div>
    </div>
</body>
</html>
